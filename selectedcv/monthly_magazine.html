<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monthly Magazine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #2c3e50; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        .scene { width: 300px; height: 400px; perspective: 1500px; }
        
        .book {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; transition: transform 1s;
            cursor: pointer;
        }
        .scene:hover .book { transform: rotateY(-180deg) translateX(50px); }
        /* Mobile tap support would require JS toggling a class, but hover works for desktop simulation */

        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 5px 15px 15px 5px; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
        
        .front {
            background: url('https://source.unsplash.com/random/600x800/?fashion') center/cover;
            display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; box-sizing: border-box;
            color: white; z-index: 2;
        }
        .front::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); border-radius: 5px 15px 15px 5px; }
        
        .back {
            background: #fff; transform: rotateY(180deg); z-index: 1;
            padding: 30px; box-sizing: border-box; display: flex; flex-direction: column;
            border-left: 5px solid #eee;
        }
        
        .title { position: relative; z-index: 10; font-size: 3rem; font-weight: bold; line-height: 0.9; margin-bottom: 10px; font-family: 'Times New Roman', serif; }
        .subtitle { position: relative; z-index: 10; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; }
        
        .article h3 { margin-top: 0; color: #333; font-size: 1.5rem; }
        .article p { color: #666; font-size: 0.9rem; line-height: 1.6; }
        .btn { margin-top: auto; padding: 10px 20px; background: #2c3e50; color: white; text-align: center; text-decoration: none; border-radius: 30px; font-weight: bold; }
        
        /* Pages effect */
        .pages { position: absolute; right: 5px; top: 5px; bottom: 5px; width: 10px; background: #fff; transform: translateZ(-2px); border-radius: 0 5px 5px 0; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div style="position: absolute; top: 50px; color: white; opacity: 0.7;">Tap cover to open</div>
    <div class="scene">
        <div class="book">
            <div class="face front">
                <div class="subtitle">January 2026</div>
                <div class="title">VISION<br>INDIA</div>
            </div>
            <div class="face back">
                <div class="article">
                    <h3>Editor's Note</h3>
                    <p>Welcome to this month's special edition focusing on sustainable development and rural innovation. We explore how villages are transforming...</p>
                    <a href="#" class="btn">Read Full Issue</a>
                </div>
            </div>
            <div class="pages"></div>
        </div>
    </div>
</body>
</html>
