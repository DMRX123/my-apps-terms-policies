<script>

let currentLang="en";

function toggleLang(){

const items=document.querySelectorAll(".lang");

if(currentLang==="en"){

items.forEach(el=>{
el.innerText=el.getAttribute("data-hi");
});

document.querySelector(".lang-btn").innerText="EN";

currentLang="hi";

}

else{

items.forEach(el=>{
el.innerText=el.getAttribute("data-en");
});

document.querySelector(".lang-btn").innerText="हिंदी";

currentLang="en";

}

}
