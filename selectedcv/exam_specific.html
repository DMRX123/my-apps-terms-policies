<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Prep</title>
    <style>
        body { margin: 0; background: #6c5ce7; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        h1 { color: white; font-size: 1.5rem; margin-bottom: 20px; }
        
        .flashcard-container { perspective: 1000px; width: 100%; max-width: 350px; height: 250px; margin-bottom: 20px; }
        
        .flashcard {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer;
            border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        /* Click to flip class */
        .flashcard.flipped { transform: rotateY(180deg); }
        
        .front, .back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; border-radius: 20px;
        }
        
        .front { background: white; color: #333; }
        .back { background: #ffeaa7; color: #2d3436; transform: rotateY(180deg); }
        
        .q-label { font-size: 0.8rem; color: #6c5ce7; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .question { font-size: 1.2rem; font-weight: 600; }
        .answer { font-size: 1.1rem; }
        
        .btn-row { display: flex; gap: 10px; width: 100%; max-width: 350px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-no { background: #ff7675; color: white; }
        .btn-yes { background: #55efc4; color: #2d3436; }

    </style>
</head>
<body>

<h1>Daily GK Quiz</h1>

<div class="flashcard-container" onclick="this.querySelector('.flashcard').classList.toggle('flipped')">
    <div class="flashcard">
        <div class="front">
            <span class="q-label">History • Question 1</span>
            <div class="question">Who was the first Governor-General of independent India?</div>
            <div style="font-size:0.8rem; color:#aaa; margin-top:20px;">(Tap to see answer)</div>
        </div>
        <div class="back">
            <span class="q-label">Answer</span>
            <div class="answer">Lord Mountbatten</div>
            <p style="font-size:0.9rem; margin-top:10px;">(C. Rajagopalachari was the first *Indian* Governor-General)</p>
        </div>
    </div>
</div>

<div class="btn-row">
    <button class="btn btn-no">Hard</button>
    <button class="btn btn-yes">Easy</button>
</div>

</body>
</html>
