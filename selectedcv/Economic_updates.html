<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economy</title>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Roboto Mono', monospace; margin: 0; padding: 20px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .full { grid-column: span 2; }
        
        h2 { font-size: 0.9rem; color: #94a3b8; margin: 0 0 10px 0; text-transform: uppercase; }
        .val { font-size: 1.8rem; font-weight: bold; }
        .up { color: #4ade80; } .down { color: #f87171; }
        
        /* CSS Bar Chart Animation */
        .chart { display: flex; align-items: flex-end; height: 100px; gap: 10px; padding-top: 20px; }
        .bar { flex: 1; background: #3b82f6; border-radius: 4px 4px 0 0; animation: grow 1.5s ease-out forwards; opacity: 0.8; }
        
        @keyframes grow { from { height: 0; } }
        
        /* Floating Coin */
        .coin-box { perspective: 800px; display: flex; justify-content: center; margin: 30px 0; }
        .coin { width: 80px; height: 80px; background: gold; border-radius: 50%; transform-style: preserve-3d; animation: spin 4s infinite linear; border: 4px solid #b8860b; box-shadow: 0 0 20px gold; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #b8860b; font-weight: bold; }
        @keyframes spin { 0% { transform: rotateY(0); } 100% { transform: rotateY(360deg); } }

    </style>
</head>
<body>

<div style="display:flex; justify-content:space-between; align-items:center;">
    <h1>Market Watch</h1>
    <div style="font-size:0.8rem; color:#4ade80;">● LIVE</div>
</div>

<div class="grid">
    <div class="card">
        <h2>Sensex</h2>
        <div class="val up">72,410</div>
        <div style="font-size:0.8rem; margin-top:5px;">▲ 1.2%</div>
    </div>
    <div class="card">
        <h2>Nifty</h2>
        <div class="val down">21,850</div>
        <div style="font-size:0.8rem; margin-top:5px;">▼ 0.4%</div>
    </div>
    
    <div class="card full">
        <h2>GDP Growth (Quarterly)</h2>
        <div class="chart">
            <div class="bar" style="height: 40%;"></div>
            <div class="bar" style="height: 55%;"></div>
            <div class="bar" style="height: 30%; background:#f87171;"></div>
            <div class="bar" style="height: 70%; background:#4ade80;"></div>
            <div class="bar" style="height: 85%; background:#4ade80;"></div>
        </div>
    </div>
</div>

<div class="coin-box">
    <div class="coin">₹</div>
</div>

<div class="card full">
    <h2>Crypto Assets</h2>
    <div style="display:flex; justify-content:space-between; margin-top:10px; border-bottom:1px solid #334155; padding-bottom:10px;">
        <span>Bitcoin</span>
        <span class="up">$45,200</span>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:10px;">
        <span>Ethereum</span>
        <span class="up">$2,800</span>
    </div>
</div>

</body>
</html>
